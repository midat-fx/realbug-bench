name: bench

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the PR's commits, for the identity check below
      - run: make lint scan selftest
      # every commit a PR adds: noreply author and committer, no co-author or generator lines
      - if: github.event_name == 'pull_request'
        run: ./bench scan "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  tasks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2 # at most two image builds at a time
      matrix:
        task:
          - pgcdc-truncated-pgoutput
          - konsumer-batch-retry-prebatch
          - konsumer-shared-broker-race
          - gaos-scenario-races
          - sqlparse-dotted-real-name
          - tomlkit-crlf-error-position
          - path-to-regexp-stringify-empty-text
          - yaml-flow-key-after-blank-line
          - immer-revoked-mapset-reads
    steps:
      - uses: actions/checkout@v4
      # every solution is graded twice: a verdict that changes between runs fails the job as FLAKY
      - run: make test TASKS=${{ matrix.task }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.task }}
          path: results/logs/
